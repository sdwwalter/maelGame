<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aventura Kids</title>
    <link id="manifest-link" rel="manifest" href="">
    <meta name="theme-color" content="#87CEEB">
    <style>
        :root {
            --bg-color: #87CEEB; /* Azul céu */
            --btn-color: #FFD700;
            --text-color: #333;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }
        .screen { display: none; flex-direction: column; align-items: center; width: 100%; padding: 20px; }
        .active { display: flex; animation: popIn 0.5s ease; }
        
        h1 { font-size: 2.5rem; margin-bottom: 20px; color: #fff; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        h2 { font-size: 2rem; margin-bottom: 20px; color: #fff; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        
        .emoji { font-size: 5rem; margin: 10px; cursor: pointer; transition: transform 0.2s; }
        .emoji:active { transform: scale(0.9); }
        
        .grid { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        
        .card {
            background: rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .card:active { transform: scale(0.9); }

        button {
            background-color: var(--btn-color);
            border: none;
            border-radius: 50px;
            padding: 15px 40px;
            font-size: 2rem;
            font-weight: bold;
            color: #ff4500;
            cursor: pointer;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            margin-top: 20px;
            font-family: inherit;
        }
        button:active { transform: translateY(4px); box-shadow: 0 4px 8px rgba(0,0,0,0.2); }

        #install-btn { font-size: 1.2rem; background-color: #32CD32; color: white; display: none; }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        .bounce { animation: bounce 1s infinite; }
    </style>
</head>
<body>

    <div id="screen-start" class="screen active">
        <h1>🌟 Aventura Mágica 🌟</h1>
        <div class="emoji bounce">🏰</div>
        <button onclick="startGame()">JOGAR!</button>
        <button id="install-btn">Instalar Jogo 📲</button>
    </div>

    <div id="screen-hero" class="screen">
        <h2>Quem é você?</h2>
        <div class="grid">
            <div class="card" onclick="chooseHero('🐶')"><div class="emoji">🐶</div></div>
            <div class="card" onclick="chooseHero('🐱')"><div class="emoji">🐱</div></div>
            <div class="card" onclick="chooseHero('🐰')"><div class="emoji">🐰</div></div>
        </div>
    </div>

    <div id="screen-place" class="screen">
        <h2>Onde vamos?</h2>
        <div class="grid">
            <div class="card" onclick="choosePlace('🌲')"><div class="emoji">🌲</div></div>
            <div class="card" onclick="choosePlace('🏖️')"><div class="emoji">🏖️</div></div>
        </div>
    </div>

    <div id="screen-game" class="screen">
        <h2>Ache a Estrela!</h2>
        <div class="grid" id="chests-container">
            </div>
    </div>

    <div id="screen-win" class="screen">
        <h1>🎉 Você Venceu! 🎉</h1>
        <div class="emoji bounce" id="win-hero">🐶</div>
        <h2 id="win-place">🌟</h2>
        <button onclick="resetGame()">De Novo!</button>
    </div>

    <script>
        // --- Lógica do Jogo RPG Infantil ---
        let playerHero = '';
        let playerPlace = '';

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function startGame() {
            showScreen('screen-hero');
        }

        function chooseHero(hero) {
            playerHero = hero;
            showScreen('screen-place');
        }

        function choosePlace(place) {
            playerPlace = place;
            if(place === '🌲') document.body.style.backgroundColor = '#98FB98'; // Verde
            if(place === '🏖️') document.body.style.backgroundColor = '#FFE4B5'; // Areia
            
            setupGame();
            showScreen('screen-game');
        }

        function setupGame() {
            const container = document.getElementById('chests-container');
            container.innerHTML = '';
            
            // Cria 3 baús. Um deles tem a estrela!
            let winningBox = Math.floor(Math.random() * 3);
            
            for(let i = 0; i < 3; i++) {
                let box = document.createElement('div');
                box.className = 'card';
                box.innerHTML = '<div class="emoji">🎁</div>';
                box.onclick = () => openBox(i === winningBox, box);
                container.appendChild(box);
            }
        }

        function openBox(isWinner, boxElement) {
            if(isWinner) {
                boxElement.innerHTML = '<div class="emoji">🌟</div>';
                setTimeout(() => {
                    document.getElementById('win-hero').innerText = playerHero + ' ❤️ 🌟';
                    showScreen('screen-win');
                }, 1000);
            } else {
                boxElement.innerHTML = '<div class="emoji">💨</div>';
                boxElement.style.opacity = '0.5';
                boxElement.onclick = null; // desativa o clique
            }
        }

        function resetGame() {
            document.body.style.backgroundColor = '#87CEEB';
            showScreen('screen-start');
        }

        // --- Lógica PWA (Progressive Web App) em Arquivo Único ---
        
        // 1. Criar e injetar o Manifest.json
        const manifest = {
            name: "Aventura Kids",
            short_name: "Aventura",
            start_url: ".",
            display: "standalone",
            background_color: "#87CEEB",
            theme_color: "#87CEEB",
            icons: [{
                src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌟</text></svg>",
                sizes: "192x192",
                type: "image/svg+xml"
            }]
        };
        const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
        const manifestUrl = URL.createObjectURL(manifestBlob);
        document.getElementById('manifest-link').href = manifestUrl;

        // 2. Criar e registrar o Service Worker
        const swCode = `
            self.addEventListener('install', (e) => e.waitUntil(self.skipWaiting()));
            self.addEventListener('activate', (e) => e.waitUntil(self.clients.claim()));
            self.addEventListener('fetch', (e) => {
                e.respondWith(fetch(e.request).catch(() => new Response('Você está offline, mas pode jogar!')));
            });
        `;
        const swBlob = new Blob([swCode], { type: 'text/javascript' });
        const swUrl = URL.createObjectURL(swBlob);
        
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register(swUrl).then(() => console.log('PWA Pronto!')).catch(console.error);
        }

        // 3. Botão de Instalação PWA
        let deferredPrompt;
        const installBtn = document.getElementById('install-btn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block'; // Mostra o botão
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') installBtn.style.display = 'none';
                deferredPrompt = null;
            }
        });
    </script>
</body>
</html>
